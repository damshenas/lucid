# Lucid system-wide default configuration.
# Non-sensitive values only. Secrets live in the encrypted DB credential store.
# Resolution order (higher wins): default.yml -> asset-class DB -> global DB -> per-user DB.

execution:
  quantity_mode: fixed_usd      # fixed_usd | pct_portfolio | half_kelly
  fixed_usd: 100.0
  pct_portfolio: 5.0
  dedup_window_seconds: 300

strategy:
  active_buy_strategy: null
  active_sell_strategy: trailing_stop
  # Per-strategy tunables (e.g. trailing_stop's atr_multiplier) live in each
  # strategy file's own CONFIG_SCHEMA, not here — see src/conf/schema.py's
  # StrategyConfig docstring.

schedule:
  task_timeout_seconds: 300
  poll_positions_seconds: 300
  daily_price_hour: 22
  intraday_price_minutes: 15
  reconcile_orders_seconds: 60
  # Strategy files are (re)scanned at startup and via the manual "Rescan" button
  # only — no periodic auto-scan (see src/conf/schema.py's ScheduleConfig).

price:
  storage_path: /data/prices
  backfill_days: 365
  # Intraday granularity ('1m'/'1h') is now set per-ticker on the watchlist itself
  # (Settings > Price > Watchlist) — see src/modules/db/models/price.py's
  # poll_interval column, not a single global value here.
  benchmark_ticker: SPY

broker:
  broker_name: trading212
  paper_mode: true

logger:
  level: INFO
  file_path: /data/lucid.log
