# Lucid system-wide default configuration.
# Non-sensitive values only. Secrets live in the encrypted DB credential store.
# Resolution order (higher wins): default.yml -> asset-class DB -> global DB -> per-user DB.

execution:
  quantity_mode: fixed_usd      # fixed_usd | pct_portfolio | half_kelly
  fixed_usd: 100.0
  pct_portfolio: 5.0
  dedup_window_seconds: 300

strategy:
  active_buy_strategy: null
  active_sell_strategy: trailing_stop
  trailing_stop:
    enabled: true
    atr_multiplier: 3.0
    profit_take_levels: [20.0, 50.0]

risk:
  enabled: false                # pre-trade risk gate is opt-in
  max_single_trade_usd: 1000.0
  max_daily_buy_usd: 5000.0
  max_open_positions: 20
  max_position_pct: 15.0

schedule:
  task_timeout_seconds: 300
  poll_positions_seconds: 300
  daily_price_hour: 22
  intraday_price_minutes: 15
  strategy_scan_hour: 3
  git_sync_minutes: 0

price:
  storage_path: /data/prices
  backfill_days: 365
  intraday_interval: 15m
  benchmark_ticker: SPY

broker:
  broker_name: trading212
  paper_mode: true

logger:
  level: INFO
  file_path: /data/lucid.log
