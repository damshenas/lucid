services:
  lucid:
    container_name: lucid
    restart: on-failure:3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      # Reuses the shared postgres from stacks/production/databases.yml (port
      # 5432 is published on the host, so host.containers.internal reaches it
      # the same way stacks/production/photos.yml's immich service does).
      # One-time setup on that postgres: `CREATE DATABASE lucid OWNER app;`
      DATABASE_URL: postgresql+asyncpg://app:${PSPW}@host.containers.internal:5432/lucid
      LUCID_ENCRYPTION_KEY: ${LCEK}
      LUCID_JWT_SECRET: ${LJWS}
      # STRATEGIES_ROOT is where the app actually loads strategies from — a writable
      # but ephemeral tmpfs path (part of the /run mount below), empty on every
      # container start. BUILTIN_STRATEGIES_ROOT is the immutable, always-available
      # copy baked into the image (docker/Dockerfile) used to seed STRATEGIES_ROOT at
      # every startup (src/scripts/sync_algorithms.py). EXT_STRATEGIES is a staging
      # mount for the optional git sync (see modules/com/git) — files are copied from
      # there into STRATEGIES_ROOT; the app never runs code directly out of it.
      STRATEGIES_ROOT: /run/strategies
      BUILTIN_STRATEGIES_ROOT: /app/strategies
      EXT_STRATEGIES: /ext_strategies
      # Bind outbound traffic to the LAN/WAN-facing NIC (same pattern as
      # services/ddns/ddns.py's SO_BINDTODEVICE use of eno1).
      BIND_IFACE: eno1
      # debug also surfaces h11's actual parse-error message for any
      # "Invalid HTTP request received." warning (see src/modules/httpdebug).
      LOG_LEVEL: debug
    ports:
      - "8686:8686"
    tmpfs:
      - /tmp
      - /run
    volumes:
      - /container/lucid/data:/data:rw,z
      - /container/lucid/ext-strategies:/ext_strategies:rw,z