services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lucid
      POSTGRES_PASSWORD: lucid
      POSTGRES_DB: lucid
    volumes:
      - lucid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucid"]
      interval: 5s
      timeout: 5s
      retries: 10

  lucid:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://lucid:lucid@db:5432/lucid
      LUCID_ENCRYPTION_KEY: ${LUCID_ENCRYPTION_KEY:?set a base64 32-byte key}
      LUCID_JWT_SECRET: ${LUCID_JWT_SECRET:?set a random secret}
      STRATEGIES_ROOT: /strategies
      # Optional outbound NIC binding:
      # BIND_IFACE: eth0
      # BIND_IP: 192.168.1.10
    ports:
      - "8686:8686"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
      - /run
    volumes:
      - lucid_data:/data
      - ../strategies:/strategies

volumes:
  lucid_pgdata:
  lucid_data:
